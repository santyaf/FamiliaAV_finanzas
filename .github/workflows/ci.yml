name: CI

on:
  push:
    branches-ignore: []   # todas las ramas
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm ci` instala exactamente lo que dice package-lock.json (builds
      # reproducibles); falla si el lockfile no coincide con package.json.
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build
